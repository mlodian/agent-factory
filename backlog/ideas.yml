  - slug: co2-per-capita-divergence
    title: Which countries decoupled GDP growth from CO2 emissions?
    theme: environment
    tags: [co2, decoupling, economics]
    source: owid
    difficulty: easy
    status: ready
    note: OWID CO2 dataset, CC BY. Cross-check GDP against worldbank.

  # ──────────────────────── MARKETING / SALES / TECH ────────────────────────

  - slug: hn-title-engagement
    title: What makes a Hacker News title get upvoted?
    theme: marketing
    tags: [engagement, nlp, headlines, marketing]
