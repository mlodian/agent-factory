# Project backlog.
#
# Every idea names a `source` from sources/registry.yml. An idea without one is
# ineligible. Ideas are phrased as questions where possible, because a question
# the data can answer makes a better project than a topic.
#
# status:   ready | blocked | built
# requires: optional list of secrets the project needs at runtime.
#           factory-pick-idea skips an idea whose requirements aren't configured.
#           `anthropic-api-key` = the project itself calls the Claude API, which the
#           Claude Code OAuth token does NOT cover. Add a repo secret named
#           FACTORY_ANTHROPIC_API_KEY to unlock these — deliberately NOT named
#           ANTHROPIC_API_KEY, which would outrank the OAuth token and silently move
#           the factory's own runs onto per-token API billing.
#
# Add ideas with /factory-add-idea "<description>".

ideas:

  # ─────────────────────────────── FINANCE ───────────────────────────────

  - slug: remittances-vs-inflation
    title: Do remittances into the Philippines rise when inflation does?
    theme: finance
    tags: [remittances, inflation, time-series, dashboard]
    source: worldbank
    difficulty: easy
    status: ready
    note: Personal remittances (BX.TRF.PWKR.CD.DT) vs CPI, 1960 onward, with a lagged-correlation view.

  - slug: revenue-concentration-sec
    title: How concentrated is revenue growth among the 50 largest US companies?
    theme: finance
    tags: [fundamentals, sec, concentration, dashboard]
    source: sec-edgar
    difficulty: medium
    status: ready
    note: Audited 10-K revenue from XBRL company facts — real figures, no scraping.

  - slug: fx-volatility-regimes
    title: Detect volatility regimes in USD/PHP since 1999
    theme: finance
    tags: [fx, volatility, regime-detection, time-series]
    source: frankfurter
    difficulty: medium
    status: ready
    note: Rolling volatility plus a simple regime classifier, annotated with the dates that mattered.

  - slug: crypto-correlation-drift
    title: Has Bitcoin's correlation with the rest of crypto weakened over time?
    theme: finance
    tags: [crypto, correlation, rolling-window]
    source: coingecko
    difficulty: medium
    status: ready
    note: Tight rate limit — fetch once, cache, checksum.

  # ──────────────────────────── CYBERSECURITY ────────────────────────────

  - slug: cvss-vs-exploitation
    title: Does a high CVSS score actually predict that a CVE gets exploited?
    theme: cyber
    tags: [vulnerability, classification, cvss, kev]
    source: cisa-kev
    difficulty: medium
    status: ready
    note: Join CISA KEV to NVD scores. The answer is "weakly", which makes for a strong talk.

  - slug: epss-vs-cvss-triage
    title: Would EPSS-first patching beat CVSS-first patching?
    theme: cyber
    tags: [vulnerability, prioritisation, epss, simulation-free]
    source: epss
    difficulty: medium
    status: ready
    note: Back-test both triage orders against the real KEV list. Measured, not modelled.

  - slug: vendor-vuln-velocity
    title: Which vendors take longest from disclosure to exploitation?
    theme: cyber
    tags: [vulnerability, vendors, lead-time, dashboard]
    source: nvd-cve
    difficulty: medium
    status: ready
    note: NVD rate limit is 5 req/30s without a key — page slowly and cache.

  - slug: cwe-weakness-trends
    title: Which weakness classes (CWE) are growing fastest in new CVEs?
    theme: cyber
    tags: [vulnerability, cwe, trends, dashboard]
    source: nvd-cve
    difficulty: easy
    status: ready
    note: Year-over-year CWE mix. Memory-safety vs injection is the headline chart.

  # ──────────────────────────────── HEALTH ────────────────────────────────

  - slug: drug-recall-patterns
    title: What drives FDA drug recalls, and are they getting more frequent?
    theme: health
    tags: [fda, recalls, classification, dashboard]
    source: openfda
    difficulty: easy
    status: ready
    note: openFDA supports server-side &count=, so aggregation is cheap.

  - slug: trials-results-reporting
    title: What share of completed clinical trials never post results?
    theme: health
    tags: [clinical-trials, transparency, sponsors]
    source: clinicaltrials
    difficulty: medium
    status: ready
    note: Break down by sponsor type and phase. A known, important transparency question.

  - slug: life-expectancy-gaps
    title: Where has the life-expectancy gap between neighbouring countries widened?
    theme: health
    tags: [who, life-expectancy, geography, dashboard]
    source: who-gho
    difficulty: easy
    status: ready
    note: WHOSIS_000001 via OData $filter. CC BY-NC-SA — attribute on the deck.

  # ───────────────────────────── ENVIRONMENT ─────────────────────────────

  - slug: manila-rainfall-extremes
    title: Are Metro Manila's heaviest rainfall days getting heavier?
    theme: environment
    tags: [weather, extremes, climate, time-series]
    source: open-meteo
    difficulty: easy
    status: ready
    note: Daily precipitation back to 1940; compare top-1% days by decade.

  - slug: solar-potential-ph-cities
    title: Rank 20 Philippine cities by rooftop solar potential
