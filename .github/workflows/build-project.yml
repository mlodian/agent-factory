name: Build project

# Build one documented, demo-ready project from real public data.
#
# Started by build-selection.yml when you pick a proposal (propose.yml offers
# three), or by hand with an idea slug. One project runs at a time: the next
# proposals only appear once this project's PR is merged.
#
# Every phase checkpoints to the branch as it finishes, so hitting the Claude
# usage limit costs one phase rather than the whole run. resume.yml retries
# hourly and the run skips phases already recorded in projects/<slug>/.phases.

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Build a specific idea slug from backlog/ideas.yml (blank = agent chooses)"
        required: false
        default: ""
      resume_slug:
        description: "Resume a paused project (set by resume.yml)"
        required: false
        default: ""

concurrency:
  group: build-project
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FACTORY_CONTACT_EMAIL: ${{ vars.FACTORY_CONTACT_EMAIL }}
      # Deliberately NOT named ANTHROPIC_API_KEY: under that name it would outrank
      # CLAUDE_CODE_OAUTH_TOKEN and move the factory's own runs to API billing.
      FACTORY_ANTHROPIC_API_KEY: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install factory tooling
        run: pip install -r scripts/requirements.txt
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pick up a paused project, if resuming
        id: resume
        run: |
          slug="${{ inputs.resume_slug }}"
          if [ -z "$slug" ]; then echo "resuming=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! [[ "$slug" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]{3,60}$ ]]; then
            echo "::error::malformed resume_slug"; exit 1
          fi
          git fetch -q origin "build/$slug"
          git checkout -q -B "build/$slug" "origin/build/$slug"
          printf '%s' "$slug" > .slug
          echo "resuming=true" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "::notice::resuming build/$slug — done so far: $(tr '\n' ' ' < "projects/$slug/.phases" 2>/dev/null || echo none)"

      # ── Phase 1: pick. Special-cased because the slug doesn't exist yet. ───
      - name: Pick an idea
        id: pick
        if: steps.resume.outputs.resuming != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "github-actions[bot]"
          settings: .github/agent-settings.json
          prompt: "/factory-pick-idea ${{ inputs.idea }}"
          claude_args: |
            --model claude-opus-5
            --permission-mode acceptEdits
            --permission-prompts none
            --max-turns 40

      - name: Read and validate slug
        id: slug
        run: |
          if [ "${{ steps.resume.outputs.resuming }}" = true ]; then
            echo "slug=${{ steps.resume.outputs.slug }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          slug="$(tr -d '[:space:]' < .slug 2>/dev/null || true)"
          if [ -z "$slug" ]; then
            echo "::notice::No project today — no buildable idea (every candidate source may be down)."
          elif ! [[ "$slug" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]{3,60}$ ]] || [ ! -d "projects/$slug" ]; then
            echo "::error::Agent wrote a malformed or missing slug; refusing to use it."; exit 1
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q -B "build/$slug"
            mkdir -p "projects/$slug"
            echo pick > "projects/$slug/.phases"
            git reset -q && git add -- "projects/$slug" "backlog/"
            git commit -q -m "checkpoint(pick): $slug"
            git push -q -u origin "HEAD:build/$slug"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # ── The rest, one checkpointed phase at a time ────────────────────────
      - name: Build
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: build, prompt: "/factory-build",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "150", paths: "backlog/",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: Verify
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: verify, prompt: "/factory-verify",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "60",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: Story
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: story, prompt: "/factory-story",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "40",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: Identity
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: art, prompt: "/factory-art",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "40",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: Charts
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: viz, prompt: "/factory-viz",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "90",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: Docs
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: docs, prompt: "/factory-docs",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "40",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: Deck
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: deck, prompt: "/factory-deck",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "50",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: QA and revisions
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: qa, prompt: "/factory-qa",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "120",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      - name: Ship
        if: steps.slug.outputs.slug != ''
        uses: ./.github/actions/phase
        with: { slug: "${{ steps.slug.outputs.slug }}", phase: ship, prompt: "/factory-ship",
                branch: "build/${{ steps.slug.outputs.slug }}", max_turns: "30", paths: "backlog/",
                oauth_token: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }

      # ── Deterministic gates ───────────────────────────────────────────────
      - name: Gates
        id: gate
        if: steps.slug.outputs.slug != '' && env.FACTORY_HALT != 'true'
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          bash scripts/gate.sh "$SLUG"
          cat .gate-results >> "$GITHUB_OUTPUT"
          if grep -q '=failure' .gate-results; then echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Drop oversized raw data and commit the render
        if: steps.slug.outputs.slug != '' && env.FACTORY_HALT != 'true'
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          find "projects/$SLUG/data/raw" -type f -size +10M -print -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -q
          git add -- "projects/$SLUG" "backlog/"
          git diff --cached --quiet || git commit -q -m "checkpoint(render): $SLUG"
          git push -q origin "HEAD:build/$SLUG"

      - name: Upload deck for review
        if: steps.gate.outputs.render == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: deck-${{ steps.slug.outputs.slug }}
          path: projects/${{ steps.slug.outputs.slug }}/deck/dist/
          retention-days: 30

      - name: Open or update the pull request
        if: steps.slug.outputs.slug != ''
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          BRANCH: build/${{ steps.slug.outputs.slug }}
          OK: ${{ steps.gate.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          done_phases="$(tr '\n' ' ' < "projects/$SLUG/.phases" 2>/dev/null || echo none)"
          {
            if [ "${FACTORY_HALT:-}" = true ]; then
              echo "> [!NOTE]"
              echo "> **Paused at the \`${FACTORY_FAILED_PHASE:-?}\` phase** — usually the Claude usage limit."
              echo "> Finished phases are committed here. resume.yml retries hourly and continues from this point."
              echo
              echo "Phases done: \`$done_phases\`"
            else
              [ "$OK" != true ] && printf '> [!WARNING]\n> Not every independent check passed. Draft for review, not for merge.\n\n'
              cat PR_BODY.md 2>/dev/null || echo "## $SLUG"
              echo
              echo "---"
              cat .pr-checks.md 2>/dev/null || true
            fi
            echo
            echo "📎 PDF and PPTX: the \`deck-$SLUG\` artifact on [this run]($RUN_URL)."
          } > .pr-body.md

          for l in in-progress verified needs-work; do gh label create "$l" --force >/dev/null 2>&1 || true; done
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --draft --head "$BRANCH" --base main \
              --title "Project: $SLUG" --body-file .pr-body.md
          else
            gh pr edit "$BRANCH" --body-file .pr-body.md
          fi

          if [ "${FACTORY_HALT:-}" = true ]; then
            gh pr edit "$BRANCH" --add-label in-progress --remove-label verified --remove-label needs-work >/dev/null
          elif [ "$OK" = true ]; then
            gh pr edit "$BRANCH" --add-label verified --remove-label in-progress --remove-label needs-work >/dev/null
            gh pr ready "$BRANCH" >/dev/null || true
          else
            gh pr edit "$BRANCH" --add-label needs-work --remove-label in-progress --remove-label verified >/dev/null
          fi
