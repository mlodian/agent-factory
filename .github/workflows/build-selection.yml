name: Build the chosen project

# The owner ticks one proposal and comments /build (or `/build <slug>`), and this
# starts that project. `/more` swaps the menu for three fresh candidates.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

jobs:
  dispatch:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'project-proposal') &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/build') || startsWith(github.event.comment.body, '/more') || startsWith(github.event.comment.body, '/present'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENT: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v7

      - name: Acknowledge
        run: gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null

      - name: Fetch the issue as it stands
        run: gh issue view "$ISSUE" --json body --jq .body > .issue-body.md

      # /more — throw this menu away and ask for three different candidates.
      - name: Ask for different candidates
        if: startsWith(github.event.comment.body, '/more')
        run: |
          offered="$(grep -oE '<!-- proposal: [a-z0-9-]+' .issue-body.md | sed 's/.*proposal: //' | tr '\n' ' ')"
          gh workflow run propose.yml -f exclude="$offered"
          gh issue comment "$ISSUE" --body "Passed over: \`$offered\`. Drafting three different candidates — a new issue will open shortly."
          gh issue close "$ISSUE" >/dev/null

      - uses: actions/setup-python@v7
        if: "!startsWith(github.event.comment.body, '/more')"
        with:
          python-version: "3.12"
      - name: Install factory tooling
        if: "!startsWith(github.event.comment.body, '/more')"
        run: pip install -r scripts/requirements.txt

      # Distinguishes a backlog idea from an existing project, catches an idea that
      # was already built, and suggests the right command instead of guessing.
      - name: Work out what was asked for
        id: pick
        if: "!startsWith(github.event.comment.body, '/more')"
        run: |
          decision="$(python3 scripts/classify_request.py .issue-body.md --comment "$COMMENT")"
          action="${decision%% *}"
          slug="${decision#* }"
          if [ "$action" = error ]; then
            gh issue comment "$ISSUE" --body "$slug"
            echo "::notice::$slug"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "action=$action" >> "$GITHUB_OUTPUT"
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the build
        if: steps.pick.outputs.go == 'true' && steps.pick.outputs.action == 'build'
        env:
          SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          gh workflow run build-project.yml -f idea="$SLUG"
          sleep 8
          url="$(gh run list --workflow build-project.yml --limit 1 --json url --jq '.[0].url')"
          gh issue comment "$ISSUE" --body "Building **\`$SLUG\`** now — [follow the run]($url).

          It runs phase by phase and checkpoints as it goes, so a usage limit pauses it rather than losing it. You'll get a pull request to review when it's done, and the next three proposals once that PR is merged."
          gh issue close "$ISSUE" >/dev/null

      - name: Start a new presentation
        if: steps.pick.outputs.go == 'true' && steps.pick.outputs.action == 'present'
        env:
          SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          gh workflow run present-project.yml -f slug="$SLUG" -f fresh=true
          sleep 8
          url="$(gh run list --workflow present-project.yml --limit 1 --json url --jq '.[0].url')"
          gh issue comment "$ISSUE" --body "Giving **\`$SLUG\`** a new story, look and deck — [follow the run]($url).

          The analysis and data are untouched; only the presentation is rebuilt. It arrives as a separate pull request, so this issue stays open for your project pick."
