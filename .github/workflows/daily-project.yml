name: Daily project

on:
  # Paused until a manual run produces a verified PR. To turn the daily run on,
  # uncomment the next two lines. Commit that edit yourself: GitHub attributes
  # scheduled runs to whoever last changed the cron, and it rejects bot actors.
  # schedule:
  #   - cron: "0 21 * * *"      # 05:00 Asia/Manila (UTC+8)
  workflow_dispatch:
    inputs:
      idea:
        description: "Build a specific idea slug from backlog/ideas.yml (blank = agent chooses)"
        required: false
        default: ""

concurrency:
  group: daily-project
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional. Sent in the User-Agent to SEC/OpenAlex/Crossref. Set under
      # Settings → Secrets and variables → Actions → Variables.
      FACTORY_CONTACT_EMAIL: ${{ vars.FACTORY_CONTACT_EMAIL }}
      # Optional. Unlocks backlog ideas that call the Claude API themselves.
      # Deliberately NOT named ANTHROPIC_API_KEY: under that name it would outrank
      # CLAUDE_CODE_OAUTH_TOKEN and move the factory's own runs to API billing.
      FACTORY_ANTHROPIC_API_KEY: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install factory tooling
        run: pip install -r scripts/requirements.txt

      # ── The agent ─────────────────────────────────────────────────────────
      - name: Build today's project
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's own token instead of the Claude GitHub App. The agent
          # only writes files; the PR is opened by a later step, so the App's broad
          # permissions (workflows, webhooks, issues…) would be granted for nothing.
          github_token: ${{ github.token }}
          # The unattended agent's permission rules. Kept out of .claude/settings.json
          # so they bind this run only, not a human's interactive sessions in the repo.
          settings: .github/agent-settings.json
          prompt: "/factory-run ${{ inputs.idea }}"
          claude_args: |
            --model claude-opus-5
            --permission-mode acceptEdits
            --permission-prompts none
            --max-turns 150

      # ── Everything below is deterministic. None of it trusts the agent. ─────
      - name: Read and validate slug
        id: slug
        run: |
          slug="$(tr -d '[:space:]' < .slug 2>/dev/null || true)"
          if [ -z "$slug" ]; then
            echo "::notice::No project today — the agent found no buildable idea. Check the log above."
          elif ! [[ "$slug" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]{3,60}$ ]]; then
            echo "::error::Agent wrote a malformed slug; refusing to use it."
            exit 1
          elif [ ! -d "projects/$slug" ]; then
            echo "::error::Slug projects/$slug does not exist."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Independent verification
        id: verify
        if: steps.slug.outputs.slug != ''
        continue-on-error: true
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: bash scripts/verify.sh "$SLUG"

      - name: Provenance gate
        id: provenance
        if: steps.slug.outputs.slug != ''
        continue-on-error: true
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: python3 scripts/check_provenance.py "$SLUG"

      # Chrome (used by Marp and mermaid-cli) can't start its sandbox under the
      # AppArmor defaults on ubuntu-24.04 runners.
      - name: Allow Chrome sandbox
        if: steps.slug.outputs.slug != ''
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Render deck
        id: deck
        if: steps.slug.outputs.slug != ''
        continue-on-error: true
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: bash scripts/render_deck.sh "$SLUG"

      - name: Upload deck for review
        if: steps.deck.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: deck-${{ steps.slug.outputs.slug }}
          path: projects/${{ steps.slug.outputs.slug }}/deck/dist/
          retention-days: 30

      - name: Drop oversized raw data
        if: steps.slug.outputs.slug != ''
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: find "projects/$SLUG/data/raw" -type f -size +10M -print -delete 2>/dev/null || true

      - name: Assemble PR body
        if: steps.slug.outputs.slug != ''
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          VERIFY: ${{ steps.verify.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
          DECK: ${{ steps.deck.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mark() { [ "$1" = success ] && echo "✅ passed" || echo "❌ $1"; }
          {
            if [ "$VERIFY" != success ] || [ "$PROVENANCE" != success ]; then
              echo "> [!WARNING]"
              echo "> The workflow's independent checks did not pass. This PR is a draft for review, not for merge."
              echo
            fi
            cat PR_BODY.md 2>/dev/null || echo "## $SLUG"
            echo
            echo "---"
            echo "### Independent checks"
            echo "Run by the workflow after the agent finished — not self-reported."
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| \`verify.sh\` in a clean venv | $(mark "$VERIFY") |"
            echo "| Provenance gate | $(mark "$PROVENANCE") |"
            echo "| Deck render | $(mark "$DECK") |"
            echo
            echo "📎 PDF and PPTX: download the \`deck-$SLUG\` artifact from [this run]($RUN_URL)."
            echo
            cat .provenance-report.md 2>/dev/null
          } > .pr-body.md

      - name: Open pull request
        if: steps.slug.outputs.slug != ''
        uses: peter-evans/create-pull-request@v8
        with:
          branch: daily/${{ steps.slug.outputs.slug }}
          title: "Daily project: ${{ steps.slug.outputs.slug }}"
          commit-message: "Add daily project ${{ steps.slug.outputs.slug }}"
          body-path: .pr-body.md
          # Only the project and the backlog can reach the PR. Even if the agent
          # edited scripts/ or .github/ despite the deny rules, it wouldn't ship.
          add-paths: |
            projects/${{ steps.slug.outputs.slug }}/**
            backlog/*.yml
          draft: ${{ steps.verify.outcome != 'success' || steps.provenance.outcome != 'success' }}
          labels: ${{ (steps.verify.outcome == 'success' && steps.provenance.outcome == 'success') && 'verified' || 'needs-work' }}
