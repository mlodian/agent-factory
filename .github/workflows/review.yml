name: Factory review

# A read-only reviewer agent assesses the week's projects and the factory's
# health, then opens an issue of checkbox recommendations. Nothing here commits:
# the owner ticks what they agree with and comments /apply (see apply-review.yml).

on:
  schedule:
    - cron: "0 1 1,15 * *"         # Saturday 09:00 Asia/Manila (UTC+8)
  workflow_dispatch:

concurrency:
  group: factory-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install factory tooling
        run: pip install -r scripts/requirements.txt

      # Facts first, from the GitHub API, so the reviewer never needs a shell.
      # Also copies unmerged projects into projects/ so they can be read.
      - name: Gather the week's facts
        run: python3 scripts/review_context.py --days 16

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: .github/reviewer-settings.json
          prompt: "/factory-review"
          claude_args: |
            --model claude-opus-5
            --permission-mode acceptEdits
            --permission-prompts none
            --max-turns 60

      # The reviewer sometimes answers in chat instead of writing the file. The review
      # is still there, so recover it from the transcript rather than losing the run.
      - name: Recover the review if it wasn't written to a file
        if: steps.review.outputs.execution_file != ''
        env:
          EXEC: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ -s .review.md ]; then echo "reviewer wrote .review.md"; exit 0; fi
          python3 - "$EXEC" <<'PY'
          import json, sys, pathlib
          raw = pathlib.Path(sys.argv[1]).read_text()
          try: msgs = json.loads(raw)
          except ValueError: msgs = [json.loads(l) for l in raw.splitlines() if l.strip()]
          texts = [b["text"] for m in msgs if isinstance(m, dict) and isinstance(m.get("message"), dict)
                   for b in (m["message"].get("content") or [])
                   if isinstance(b, dict) and b.get("type") == "text" and b.get("text", "").strip()]
          body = max(texts, key=len) if texts else ""
          if len(body) > 200:
              pathlib.Path(".review.md").write_text(body + "\n\n<sub>Recovered from the run log: the reviewer replied instead of writing .review.md.</sub>\n")
              print("recovered the review from the transcript")
          else:
              print("nothing substantial in the transcript to recover")
          PY

      - name: Open the review issue
        run: |
          if [ ! -s .review.md ]; then
            echo "::error::The reviewer produced no .review.md and nothing could be recovered."
            exit 1
          fi
          if ! grep -q '<!-- action:' .review.md; then
            echo "::warning::The review has no actionable items this week."
          fi
          prev="$(gh issue list --label factory-review --state open --json number --jq '[.[].number] | map("#\(.)") | join(", ")')"
          if [ -n "$prev" ]; then
            printf '\n> [!NOTE]\n> Earlier review(s) still open: %s. /apply still works on them.\n' "$prev" >> .review.md
          fi
          gh label create factory-review --color 5319e7 --description "Weekly factory review" --force
          gh issue create \
            --title "Factory review — $(date -u +%Y-%m-%d)" \
            --label factory-review \
            --body-file .review.md
