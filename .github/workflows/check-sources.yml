name: Check data sources

# Weekly: confirm every source in sources/registry.yml still answers. If one has
# gone down or moved, open (or update) an issue so a human can fix the registry
# before the daily agent starts skipping ideas that depend on it.

on:
  schedule:
    - cron: "0 0 * * 1"         # Mondays 08:00 Asia/Manila
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACTORY_CONTACT_EMAIL: ${{ vars.FACTORY_CONTACT_EMAIL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Probe every source
        id: probe
        continue-on-error: true
        run: python3 scripts/check_sources.py | tee /tmp/sources.txt

      - name: Report outage
        if: steps.probe.outcome == 'failure'
        run: |
          body="$(printf 'The weekly source check found sources that did not answer.\n\n```\n%s\n```\n\nFix the entry in `sources/registry.yml`, or mark it `unattended: false` if it blocks automated traffic.' "$(cat /tmp/sources.txt)")"
          existing="$(gh issue list --label source-outage --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create source-outage --color d93f0b --force
            gh issue create --title "Data sources unavailable" --label source-outage --body "$body"
          fi
