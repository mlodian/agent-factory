name: Publish showcase

# On every merge: attach PDF/PPTX decks to a per-project GitHub Release (binaries
# stay out of git history), then rebuild and deploy the showcase site.

on:
  push:
    branches: [main]
    paths: ["projects/**", "scripts/build_index.py", "templates/theme.css"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write     # create per-project releases
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Release decks that don't have one yet
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > /tmp/released.txt
          for deck in projects/*/deck/deck.md; do
            [ -e "$deck" ] || continue
            slug="$(basename "$(dirname "$(dirname "$deck")")")"
            grep -qx "deck-$slug" /tmp/released.txt && continue
            echo "::group::releasing $slug"
            if bash scripts/render_deck.sh "$slug"; then
              title="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('title', sys.argv[2]))" "projects/$slug/project.json" "$slug" 2>/dev/null || echo "$slug")"
              gh release create "deck-$slug" \
                "projects/$slug/deck/dist/deck.pdf" "projects/$slug/deck/dist/deck.pptx" \
                --title "Deck: $title" \
                --notes "Presentation for [projects/$slug](../../tree/main/projects/$slug). Rendered from deck/deck.md."
              echo "deck-$slug" >> /tmp/released.txt
            else
              echo "::warning::Deck render failed for $slug — no release created."
            fi
            echo "::endgroup::"
          done

      - name: Build site
        run: python3 scripts/build_index.py --out site --released /tmp/released.txt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
