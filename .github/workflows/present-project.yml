name: Present project

# Run the presentation team on a project that's already built: a new data story,
# its own visual identity, charts from the real data, a story-led README, a fresh
# deck, and the QA loop. Use it to restyle older decks or retry a failed deck.
# Opens a PR; nothing lands until you merge it.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Project to (re)present, e.g. 2026-09-11-cvss-vs-exploitation"
        required: true

concurrency:
  group: present-${{ inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  present:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FACTORY_CONTACT_EMAIL: ${{ vars.FACTORY_CONTACT_EMAIL }}
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate slug
        run: |
          if ! [[ "$SLUG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]{3,60}$ ]] || [ ! -d "projects/$SLUG" ]; then
            echo "::error::projects/$SLUG doesn't exist on main. Merge the project's PR first."
            exit 1
          fi
          printf '%s' "$SLUG" > .slug

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install factory tooling
        run: pip install -r scripts/requirements.txt

      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Presentation team
        id: team
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: .github/agent-settings.json
          prompt: "/factory-present ${{ inputs.slug }}"
          claude_args: |
            --model claude-opus-5
            --permission-mode acceptEdits
            --permission-prompts none
            --max-turns 200

      # On failure, keep the agent transcript briefly so the cause (e.g. permission
      # denials) can be diagnosed. Artifacts on a public repo are downloadable by any
      # signed-in user, so: failures only, 3 days.
      - name: Keep agent transcript
        if: failure() && steps.team.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: transcript-${{ inputs.slug }}-${{ github.run_id }}
          path: ${{ steps.team.outputs.execution_file }}
          retention-days: 3

      - name: Gates
        id: gate
        run: |
          bash scripts/gate.sh "$SLUG"
          cat .gate-results >> "$GITHUB_OUTPUT"
          if grep -q '=failure' .gate-results; then echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload deck for review
        if: steps.gate.outputs.render == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: deck-${{ inputs.slug }}
          path: projects/${{ inputs.slug }}/deck/dist/
          retention-days: 30

      - name: Assemble PR body
        env:
          OK: ${{ steps.gate.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            [ "$OK" != true ] && printf '> [!WARNING]\n> Not every independent check passed. Draft for review, not for merge.\n\n'
            echo "## New presentation: \`$SLUG\`"
            echo
            if [ -f "projects/$SLUG/deck/STORY.md" ]; then
              grep -m1 -E '^\*\*The one insight:\*\*' "projects/$SLUG/deck/STORY.md" || true
              grep -m1 -E '^\*\*Arc:\*\*' "projects/$SLUG/deck/STORY.md" || true
            fi
            [ -f "projects/$SLUG/deck/identity.json" ] && python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(f\"**Identity:** {d.get('name')} — {d.get('mood')}\")" "projects/$SLUG/deck/identity.json"
            echo
            echo "---"
            cat .pr-checks.md
            echo
            echo "📎 Slides as PDF and PPTX: download the \`deck-$SLUG\` artifact from [this run]($RUN_URL)."
          } > .pr-body.md

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: present/${{ inputs.slug }}
          title: "New presentation: ${{ inputs.slug }}"
          commit-message: "Present ${{ inputs.slug }} with the presentation team"
          body-path: .pr-body.md
          add-paths: |
            projects/${{ inputs.slug }}/**
          draft: ${{ steps.gate.outputs.ok != 'true' }}
          labels: ${{ steps.gate.outputs.ok == 'true' && 'verified' || 'needs-work' }}
